include = ["tools/**/*.py"]
target-version = "py311"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "ANN"]

# Existing modules convert under #501; remove entries as they gain annotations.
[lint.per-file-ignores]
"tools/shared-accessors.py" = ["ANN"]
"tools/simulation/console_adapter.py" = ["ANN"]
"tools/test-generated-abi.py" = ["ANN"]
"tools/test-shared-accessors.py" = ["ANN"]
"tools/test-simulation.py" = ["ANN"]
"tools/train-edge-comparison.py" = ["ANN"]
