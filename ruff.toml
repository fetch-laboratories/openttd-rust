include = ["tools/**/*.py"]
target-version = "py311"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "ANN"]

# Existing modules convert under #501; remove entries as they gain annotations.
[lint.per-file-ignores]
"tools/simulation/aircraft.py" = ["ANN"]
"tools/simulation/rails.py" = ["ANN"]
"tools/simulation/stations.py" = ["ANN"]
"tools/simulation/towns.py" = ["ANN"]
"tools/test-generated-abi.py" = ["ANN"]
