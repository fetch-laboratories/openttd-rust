name: Install apt packages
description: Install system packages with bounded downloads and fallback mirrors
inputs:
  packages:
    description: Space-separated package names
    required: true
  recommends:
    description: Also install recommended packages
    default: 'false'
runs:
  using: composite
  steps:
  - shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PACKAGES: ${{ inputs.packages }}
      RECOMMENDS: ${{ inputs.recommends }}
    run: |
      # A mirror can stall without failing: on 2026-11-24 GitHub's hosted runners
      # installed from us-east-2.ec2.archive.ubuntu.com in a median 5.1 minutes, the
      # longest 20.2, while Emscripten's jobs on the same pool, pointed at Azure, took
      # at most 0.2. Azure and Canonical's archive have each stalled before too (#858,
      # #833, #841). The first two attempts get 60 seconds per command, and each failed
      # attempt moves to a host not yet tried: the configured mirror, then Azure, then
      # Canonical's archive, rewritten wherever the sources name it (mirror lists,
      # `URIs:` and `deb` lines). With only two hosts the last attempt stays on the
      # second, never returning to the one that stalled. The last attempt has no bound
      # of its own, as the plain install had none: a slow install beats a failed job,
      # and the calling job's own limit still applies. apt keeps what an interrupted
      # attempt downloaded.
      sudo=$(command -v sudo || true)
      read -r -a packages <<< "$PACKAGES"
      options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
      install=(install -y)
      if [ "$RECOMMENDS" != true ]; then
        # Recommended desktop packages (GTK, Vulkan drivers) only slow every job.
        install+=(--no-install-recommends)
      fi
      $sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
      shopt -s nullglob
      files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list)
      shopt -u nullglob
      # The mirror lists the sources name, in order; Blacksmith's is not apt-mirrors.txt.
      lists=()
      while read -r list; do
        if [ -f "$list" ] && [[ " ${lists[*]} " != *" $list "* ]]; then
          lists+=("$list")
        fi
      done < <({ cat "${files[@]}" 2>/dev/null || true; } | grep -o 'mirror+file:[^[:space:]]*' | sed 's/^mirror+file://'; echo /etc/apt/apt-mirrors.txt)
      sources() {
        { cat "${lists[@]}" "${files[@]}" 2>/dev/null || true; } | sha256sum
      }
      # The configured mirror: the first host of a mirror list, else of the sources.
      configured=$(cat "${lists[@]}" "${files[@]}" 2>/dev/null |
        sed -n 's|^\([^#]*[[:space:]]\)\{0,1\}https\{0,1\}://\([^/[:space:]]*\)/ubuntu.*|\2|p' |
        grep -v '^security\.ubuntu\.com$' | head -n 1 || true)
      hosts=()
      if [ -n "$configured" ]; then
        for host in "$configured" azure.archive.ubuntu.com archive.ubuntu.com; do
          if [[ " ${hosts[*]} " != *" $host "* ]]; then
            hosts+=("$host")
          fi
        done
      fi
      current=0
      updated=false
      for attempt in 1 2 3; do
        bounded=($sudo timeout 60)
        if [ "$attempt" = 3 ]; then
          bounded=($sudo)
        fi
        if [ "$updated" = false ] && "${bounded[@]}" apt-get "${options[@]}" update; then
          updated=true
        fi
        if [ "$updated" = true ] &&
           "${bounded[@]}" apt-get "${options[@]}" "${install[@]}" --download-only "${packages[@]}"; then
          break
        fi
        if [ "$attempt" = 3 ]; then
          exit 1
        fi
        before=$(sources)
        stalled=${hosts[current]:-the configured mirror}
        if [ $((current + 1)) -lt "${#hosts[@]}" ]; then
          current=$((current + 1))
          for file in "${lists[@]}" "${files[@]}"; do
            if [ -f "$file" ]; then
              $sudo sed -i "s|https\{0,1\}://${stalled//./\\.}/ubuntu|http://${hosts[current]}/ubuntu|g" "$file"
            fi
          done
        fi
        echo "::warning::apt attempt $attempt failed or stalled on $stalled; retrying on ${hosts[current]:-the same sources}"
        # An index fetched from the sources still in use stays valid.
        if [ "$(sources)" != "$before" ]; then
          updated=false
        fi
      done
      $sudo apt-get "${options[@]}" "${install[@]}" "${packages[@]}"
