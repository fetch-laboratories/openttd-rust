name: Install apt packages
description: Install system packages with bounded downloads and fallback mirrors
inputs:
  packages:
    description: Space-separated package names
    required: true
  recommends:
    description: Also install recommended packages
    default: 'false'
runs:
  using: composite
  steps:
  - shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PACKAGES: ${{ inputs.packages }}
      RECOMMENDS: ${{ inputs.recommends }}
    run: |
      # A mirror can stall without failing: on 2026-11-24 GitHub's hosted runners
      # installed from us-east-2.ec2.archive.ubuntu.com in a median 5.1 minutes, the
      # longest 20.2, while Emscripten's jobs on the same pool, pointed at Azure, took
      # at most 0.2. Azure and Canonical's archive have each stalled before too (#858,
      # #833, #841). The first two attempts get 60 seconds per command, and each failed
      # attempt moves to a host not yet tried: the configured mirror (a mirror list's
      # first by priority), then Azure, then Canonical's archive. Every archive URL the
      # sources name (mirror lists, `URIs:` and `deb` lines) moves to it, so no other
      # entry of a list stays in front. With only two hosts the last attempt stays on
      # the second, never returning to the one that stalled. The last attempt has no bound
      # of its own, as the plain install had none: a slow install beats a failed job,
      # and the calling job's own limit still applies. apt keeps what an interrupted
      # attempt downloaded.
      sudo=$(command -v sudo || true)
      read -r -a packages <<< "$PACKAGES"
      options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
      install=(install -y)
      if [ "$RECOMMENDS" != true ]; then
        # Recommended desktop packages (GTK, Vulkan drivers) only slow every job.
        install+=(--no-install-recommends)
      fi
      $sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
      shopt -s nullglob
      files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list)
      shopt -u nullglob
      # The mirror lists the sources name, in order; Blacksmith's is not apt-mirrors.txt.
      lists=()
      while read -r list; do
        if [ -f "$list" ] && [[ " ${lists[*]} " != *" $list "* ]]; then
          lists+=("$list")
        fi
      done < <({ cat "${files[@]}" /dev/null 2>/dev/null || true; } | grep -o 'mirror+file:[^[:space:]]*' | sed 's/^mirror+file://'; echo /etc/apt/apt-mirrors.txt)
      sources() {
        { cat "${lists[@]}" "${files[@]}" /dev/null 2>/dev/null || true; } | sha256sum
      }
      # The configured mirror: a mirror list's first archive host by priority, else the
      # sources' first.
      configured=$({ cat "${lists[@]}" /dev/null 2>/dev/null || true; } | awk '
        /^[[:space:]]*#/ { next }
        match($0, /https?:\/\/[^\/[:space:]]+\/ubuntu/) {
          host = substr($0, RSTART, RLENGTH)
          sub(/^https?:\/\//, "", host)
          sub(/\/ubuntu$/, "", host)
          if (host == "security.ubuntu.com") next
          rank = 1e9
          if (match($0, /priority:[0-9]+/)) rank = substr($0, RSTART + 9, RLENGTH - 9) + 0
          if (best == "" || rank < low) { best = host; low = rank }
        }
        END { print best }')
      if [ -z "$configured" ]; then
        configured=$({ cat "${files[@]}" /dev/null 2>/dev/null || true; } |
          sed -n 's|^\([^#]*[[:space:]]\)\{0,1\}https\{0,1\}://\([^/[:space:]]*\)/ubuntu.*|\2|p' |
          grep -v '^security\.ubuntu\.com$' | head -n 1 || true)
      fi
      # The archive hosts a retry moves off: every one an active entry names, in any
      # mirror list or source, and Ubuntu's.
      archives="([a-z0-9-]+\\.)*archive\\.ubuntu\\.com"
      while read -r host; do
        archives+="|${host//./\\.}"
      done < <({ cat "${lists[@]}" "${files[@]}" /dev/null 2>/dev/null || true; } |
        grep -v '^[[:space:]]*#' | grep -o 'https\{0,1\}://[^/[:space:]]*/ubuntu' |
        sed 's|^https\{0,1\}://||; s|/ubuntu$||' | grep -v '^security\.ubuntu\.com$' | sort -u)
      hosts=()
      if [ -n "$configured" ]; then
        for host in "$configured" azure.archive.ubuntu.com archive.ubuntu.com; do
          if [[ " ${hosts[*]} " != *" $host "* ]]; then
            hosts+=("$host")
          fi
        done
      fi
      # Run 45526257014's runner had sources that named no archive: apt-get update read
      # nothing, every package was "Unable to locate" and no host was left to move to.
      # Only active entries count: a source's own archive URL, or one in a mirror list an
      # active source uses (apt-mirrors.txt is in `lists` whether or not one does). A
      # deb822 stanza with `Enabled: no` is not active.
      active() {
        local file
        for file; do
          if [ ! -f "$file" ]; then
            continue
          fi
          case $file in
            *.sources)
              awk 'BEGIN { RS = ""; FS = "\n" }
                {
                  on = 1
                  for (i = 1; i <= NF; i++)
                    if (tolower($i) ~ /^[[:space:]]*enabled:[[:space:]]*no[[:space:]]*$/) on = 0
                  if (on) for (i = 1; i <= NF; i++) if ($i !~ /^[[:space:]]*#/) print $i
                }' "$file" ;;
            *) grep -v '^[[:space:]]*\(#\|$\)' "$file" || true ;;
          esac
        done
      }
      used=()
      while read -r list; do
        if [ -f "$list" ]; then
          used+=("$list")
        fi
      done < <(active "${files[@]}" | grep -o 'mirror+file:[^[:space:]]*' | sed 's/^mirror+file://' || true)
      named=$(active "${used[@]}" "${files[@]}" | grep -o 'https\{0,1\}://[^/[:space:]]*/ubuntu' |
        grep -v '//security\.ubuntu\.com/' | head -n 1 || true)
      # With none, the first attempt still runs on the sources as found. Each failed one
      # then writes the script's own source for the next host, which a later move
      # rewrites, and sets aside each source that uses a mirror list: that list names no
      # archive, and apt fails its whole update on a list it cannot read.
      fallback=
      if [ -z "$named" ]; then
        hosts=("" azure.archive.ubuntu.com archive.ubuntu.com)
        fallback=/etc/apt/sources.list.d/apt-install-fallback.sources
        codename=$(. /etc/os-release && echo "${VERSION_CODENAME:-$UBUNTU_CODENAME}")
      fi
      # The sources and mirror lists as apt reads them, for the log of a failed attempt.
      show() {
        echo "::group::apt sources after attempt $1"
        for file in "${files[@]}" "${lists[@]}"; do
          if [ -f "$file" ]; then
            echo "$file:"
            active "$file"
          fi
        done
        echo "::endgroup::"
      }
      current=0
      updated=false
      for attempt in 1 2 3; do
        bounded=($sudo timeout 60)
        if [ "$attempt" = 3 ]; then
          bounded=($sudo)
        fi
        if [ "$updated" = false ] && "${bounded[@]}" apt-get "${options[@]}" update; then
          updated=true
        fi
        if [ "$updated" = true ] &&
           "${bounded[@]}" apt-get "${options[@]}" "${install[@]}" --download-only "${packages[@]}"; then
          break
        fi
        show "$attempt"
        if [ "$attempt" = 3 ]; then
          exit 1
        fi
        before=$(sources)
        stalled=${hosts[current]:-the sources as found}
        if [ $((current + 1)) -lt "${#hosts[@]}" ]; then
          current=$((current + 1))
          if [ -n "$fallback" ] && [[ " ${files[*]} " != *" $fallback "* ]]; then
            $sudo mkdir -p "${fallback%/*}"
            printf '%s\n' 'Types: deb' "URIs: http://${hosts[current]}/ubuntu" \
              "Suites: $codename $codename-updates $codename-backports $codename-security" \
              'Components: main restricted universe multiverse' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' |
              $sudo tee "$fallback" > /dev/null
            kept=()
            for file in "${files[@]}"; do
              if ! active "$file" | grep -q 'mirror+file:'; then
                kept+=("$file")
              elif [[ $file == *.sources ]]; then
                $sudo mv "$file" "$file.apt-install-disabled"
              else
                $sudo sed -i '/^[[:space:]]*[^#[:space:]].*mirror+file:/s/^/# /' "$file"
                kept+=("$file")
              fi
            done
            files=("${kept[@]}" "$fallback")
          fi
          for file in "${lists[@]}" "${files[@]}"; do
            if [ -f "$file" ]; then
              $sudo sed -E -i "s#https?://($archives)/ubuntu#http://${hosts[current]}/ubuntu#g" "$file"
            fi
          done
        fi
        echo "::warning::apt attempt $attempt failed or stalled on $stalled; retrying on ${hosts[current]:-the same sources}"
        # An index fetched from the sources still in use stays valid.
        if [ "$(sources)" != "$before" ]; then
          updated=false
        fi
      done
      $sudo apt-get "${options[@]}" "${install[@]}" "${packages[@]}"
