name: Migration task
description: Propose a bounded C++ to Rust migration task
title: "[Migration]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe a migration task taken from docs/roadmap.md. The original game is the behavioral specification; preserve observed behavior, including quirks. See docs/workflow.md#records.
  - type: input
    id: attribution
    attributes:
      label: Agent attribution
      description: Name the agent, exact model and effort; human authors may enter "Human".
      placeholder: "Agent: /root/implementation | Model: gpt-6.1-sol | Reasoning effort: high"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Task owner
      description: Name the agent or person responsible for implementation and its draft PR.
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap item
      description: Name the phase and item in docs/roadmap.md. Root updates it first for other work.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or coupled group
      description: Name the C++ component or coupled group.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Ownership boundary
      description: Describe the state and control flow Rust will own and the C++ facade and callbacks that remain. Give budgets for original C++ retirement, net fork glue and tooling. Removed fork glue does not count as original retirement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence plan
      description: Name the harness scenarios to use or add and the relevant tests. Name any concrete gap that needs a narrow comparison.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Behavior and FFI risks
      description: Identify observable behavior, state, ownership, ABI, or FFI risks, including quirks that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the behavior evidence, integration, and checks required before accepting the replacement. Report tools/port-metrics.py; retire more original C++ than net glue plus tooling added, or explain why.
    validations:
      required: true
