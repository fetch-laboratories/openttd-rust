name: Commit checker

on:
  pull_request:
  # A required check must report on each merge group too; Full's Quick runs it there.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  commit-checker:
    name: Commit checker
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Integration merges can place PR commits beyond a shallow ancestry.
        fetch-depth: 0

    - name: Get pull-request commits
      uses: OpenTTD/actions/checkout-pull-request@v6

    - name: Check commits
      uses: OpenTTD/OpenTTD-git-hooks@eeb3791aadf0aded5a7cd634c80823f17e87af9c
