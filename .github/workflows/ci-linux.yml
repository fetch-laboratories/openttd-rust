name: CI (Linux)

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      cache-only:
        required: false
        type: boolean
        default: false
      compiler:
        required: true
        type: string
      cxxcompiler:
        required: true
        type: string
      libraries:
        required: true
        type: string
      extra-cmake-parameters:
        required: true
        type: string

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  linux:
    name: CI
    if: ${{ !inputs.cache-only || inputs.compiler != 'clang' }}

    # Only the uncached Clang (PCH) build benefits from the paid runner. The
    # ccache GCC builds finish within the free Emscripten/macOS critical path.
    runs-on: ${{ inputs.compiler == 'clang' && vars.CI_LINUX_PLATFORM || 'ubuntu-24.04' }}
    env:
      CC: ${{ inputs.compiler }}
      CXX: ${{ inputs.cxxcompiler }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref }}
        persist-credentials: false
        fetch-depth: 1

    # Keep the Clang build's upstream PCH coverage; cache both GCC flavours.
    - name: Identify compiler cache
      id: compiler-image
      env:
        EXTRA_CMAKE_PARAMETERS: ${{ inputs.extra-cmake-parameters }}
      run: |
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "flavour=$(printf '%s' "$EXTRA_CMAKE_PARAMETERS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Restore compiler cache
      if: inputs.compiler != 'clang'
      id: compiler-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-linux-v2-${{ inputs.compiler }}-${{ steps.compiler-image.outputs.flavour }}-${{ steps.compiler-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}-${{ inputs.checkout-ref || github.sha }}
        restore-keys: ccache-linux-v2-${{ inputs.compiler }}-${{ steps.compiler-image.outputs.flavour }}-${{ steps.compiler-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}-

    # Use the same ABI-hashed file cache as Windows/macOS, without Mono/NuGet.
    - name: Restore vcpkg binary cache
      id: vcpkg-binary-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-bin-x64-linux-${{ inputs.compiler }}-${{ hashFiles('vcpkg.json') }}-${{ steps.compiler-image.outputs.version }}
        restore-keys: vcpkg-bin-x64-linux-${{ inputs.compiler }}-${{ hashFiles('vcpkg.json') }}-

    - name: Setup vcpkg
      timeout-minutes: 5
      run: |
        git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Install dependencies
      timeout-minutes: 10
      run: |
        echo "::group::Update apt"
        sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        echo "::endgroup::"

        echo "::group::Install dependencies"
        apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        packages=(
          ccache
          liballegro4-dev
          libcurl4-openssl-dev
          libfontconfig-dev
          libharfbuzz-dev
          libicu-dev
          liblzma-dev
          liblzo2-dev
          libogg-dev
          libopus-dev
          libopusfile-dev
          ${{ inputs.libraries }}
          zlib1g-dev
        )
        # The Azure mirror sometimes trickles at about 40 kB/s without timing out, where
        # the 31 MB set normally takes seconds: bound the download and retry elsewhere.
        for attempt in 1 2 3; do
          if sudo timeout 90 apt-get "${apt_options[@]}" install -y --no-install-recommends --download-only "${packages[@]}"; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            exit 1
          fi
          echo "::warning::apt download attempt $attempt failed or stalled; retrying without the Azure mirror"
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        done
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"

        echo "::group::Install vcpkg dependencies"

        # Disable vcpkg integration, as we mostly use system libraries.
        mv vcpkg.json vcpkg-disabled.json

        # We only use breakpad from vcpkg, as its CMake files
        # are a bit special. So the Ubuntu's variant doesn't work.
        "$RUNNER_TEMP/vcpkg/vcpkg" install breakpad

        echo "::endgroup::"
      env:
        DEBIAN_FRONTEND: noninteractive
        VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite

    - name: Save vcpkg binary cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}

    - name: Install OpenGFX
      uses: ./.github/actions/install-opengfx

    # cmake/Rust.cmake requires the rust-toolchain.toml channel.
    - name: Install Rust
      run: |
        channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
        rustc -vV

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 600M
        CCACHE_BASEDIR: ${{ github.workspace }}
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cache_parameters=()
        if [ "${{ inputs.compiler }}" != clang ]; then
          cache_parameters=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON)
          ccache -z
        fi
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          ${{ inputs.extra-cmake-parameters }} "${cache_parameters[@]}"
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc)
        echo "::endgroup::"
        if [ "${{ inputs.compiler }}" != clang ]; then
          ccache -sv
        fi

    - name: Restore the dependency manifest
      run: mv vcpkg-disabled.json vcpkg.json

    - name: Test
      if: ${{ !inputs.cache-only }}
      run: |
        (
          cd build
          ctest -j $(nproc) --timeout 120
        )

        # Check no tracked files have been modified.
        git diff --exit-code

    - name: Trim compiler cache
      if: inputs.compiler != 'clang' && github.event_name == 'push' && github.ref == 'refs/heads/rust-migration'
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 600M
      run: ccache --cleanup

    - name: Save compiler cache
      if: inputs.compiler != 'clang' && github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
