name: CI (Windows)

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      cache-only:
        required: false
        type: boolean
        default: false
      arch:
        required: true
        type: string
      semantic-subset:
        required: false
        type: boolean
        default: false
      # Full runs x86 for its Rust checks alone (#896): both x86 failures from
      # 11-05 to 11-10 came from that step. The x86 build stays in the cadence.
      rust-only:
        required: false
        type: boolean
        default: false

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  windows:
    name: CI

    # The pinned breakpad dependency uses stdext::checked_array_iterator,
    # which newer Visual Studio standard libraries removed.
    runs-on: ${{ vars.CI_WINDOWS_HEAVY || 'windows-2022' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref }}
        persist-credentials: false

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install OpenGFX
      uses: ./.github/actions/install-opengfx

    - name: Install MSVC problem matcher
      uses: ammaraskar/msvc-problem-matcher@master

    - name: Configure developer command prompt for ${{ inputs.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch }}
        vsversion: '2022'

    - name: Setup Python for Rust evidence
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install pinned Rust and selected target
      shell: bash
      run: |
        case "${{ inputs.arch }}" in
          x86) rust_target=i686-pc-windows-msvc ;;
          x64) rust_target=x86_64-pc-windows-msvc ;;
          *) echo "Unsupported protected architecture"; exit 1 ;;
        esac
        channel=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target "$rust_target"
        echo "RUST_TARGET=$rust_target" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
        mkdir -p .local/windows-evidence
        rustc -vV | tee .local/windows-evidence/rustc.txt
        rustup target list --installed --toolchain "$channel" | tee .local/windows-evidence/installed-targets.txt

    - name: Rust checks for actual selected target
      if: ${{ !inputs.cache-only }}
      shell: bash
      run: |
        # Git Bash prepends its unrelated link.exe; use the configured MSVC tools.
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        cargo fmt --all -- --check
        cargo check --workspace --all-targets --locked --target "$RUST_TARGET"
        cargo clippy --workspace --all-targets --locked --target "$RUST_TARGET" -- -D warnings
        cargo test --workspace --locked --target "$RUST_TARGET"

    - name: Identify runner image
      if: ${{ !inputs.rust-only }}
      id: runner-image
      shell: bash
      env:
        NAMESPACE: ${{ (github.event_name == 'push' || inputs.checkout-ref == '' && github.ref == 'refs/heads/rust-migration') && 'protected' || 'candidate' }}
      run: |
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "vcpkg-namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"

    # vcpkg names each cached binary by its ABI hash (port version, triplet,
    # compiler, vcpkg scripts), so a stale entry is never reused; it simply
    # misses. Keys are unique per commit and restore the newest prefix match,
    # so a run that builds packages can always save a fresher set (#699).
    # Requested runs build candidate code, so they save under their own
    # namespace, which protected pushes and cadence runs never restore.
    - name: Restore vcpkg binary cache
      if: ${{ !inputs.rust-only }}
      id: vcpkg-binary-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-bin-v2-${{ steps.runner-image.outputs.vcpkg-namespace }}-${{ inputs.arch }}-${{ hashFiles('vcpkg.json') }}-${{ steps.runner-image.outputs.version }}-${{ inputs.checkout-ref || github.sha }}
        restore-keys: |
          vcpkg-bin-v2-${{ steps.runner-image.outputs.vcpkg-namespace }}-${{ inputs.arch }}-${{ hashFiles('vcpkg.json') }}-${{ steps.runner-image.outputs.version }}-
          vcpkg-bin-v2-${{ steps.runner-image.outputs.vcpkg-namespace }}-${{ inputs.arch }}-
          vcpkg-bin-v2-protected-${{ inputs.arch }}-${{ hashFiles('vcpkg.json') }}-${{ steps.runner-image.outputs.version }}-
          vcpkg-bin-v2-protected-${{ inputs.arch }}-

    - name: List restored vcpkg binaries
      if: ${{ !inputs.rust-only }}
      shell: bash
      run: |
        temp=$(cygpath -u "$RUNNER_TEMP")
        mkdir -p "$temp/vcpkg-binary-cache"
        find "$temp/vcpkg-binary-cache" -name '*.zip' | sort > "$temp/vcpkg-restored.txt"
        echo "Restored $(wc -l < "$temp/vcpkg-restored.txt") vcpkg binary archive(s)"

    # MSVC caching needs embedded /Z7 debug info and no PCH; ccache hashes the
    # compiler binary, arguments, INCLUDE environment and every included header.
    - name: Install ccache
      if: ${{ !inputs.rust-only }}
      shell: bash
      run: |
        v=4.14.1
        curl -fsSL -o ccache.zip "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip"
        echo "6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache.zip" | sha256sum -c -
        unzip -q -j ccache.zip "ccache-$v-windows-x86_64/ccache.exe" -d "$RUNNER_TEMP/ccache-bin"
        rm ccache.zip
        echo "CCACHE_EXE=$(cygpath -m "$RUNNER_TEMP/ccache-bin/ccache.exe")" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      if: ${{ !inputs.rust-only }}
      id: compiler-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache
        # compiler_check=content hashes cl.exe but not its backend DLLs, so the
        # runner image (and with it the MSVC toolset) is part of the key.
        key: ccache-msvc-v1-${{ inputs.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}-${{ inputs.checkout-ref || github.sha }}
        restore-keys: ccache-msvc-v1-${{ inputs.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}-

    - name: Fetch pinned native-test oracle headers
      if: ${{ !inputs.rust-only }}
      shell: bash
      run: |
        baseline=$(sed -n 's/  "commit": "\(.*\)"/\1/p' migration/baseline.json)
        git fetch --no-tags --depth=1 origin "$baseline"

    - name: Build
      if: ${{ !inputs.rust-only }}
      id: build
      shell: bash
      env:
        NINJA_STATUS: "[%f/%t -- %e] " # [finished_edges/total_edges -- elapsed_time], default value is "[%f/%t] "
        # Upstream setup configures a Packages feed this fork does not maintain;
        # use a local files cache persisted by actions/cache instead.
        VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 1G
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        rust_parameters=(-DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_C_COMPILER_LAUNCHER="$CCACHE_EXE" -DCMAKE_CXX_COMPILER_LAUNCHER="$CCACHE_EXE"
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded)
        "$CCACHE_EXE" -z
        echo "::group::CMake"
        cmake -S . -B build \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch }}-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          "${rust_parameters[@]}"
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build build --parallel 4 -- -d keeprsp
        mkdir -p .local/windows-evidence
        { "$CCACHE_EXE" --show-config; "$CCACHE_EXE" -sv; } | tee .local/windows-evidence/ccache-stats.txt
        echo "::endgroup::"

    # Save only when vcpkg built packages the restored set lacked. After a
    # successful build, keep just the archives this build's ABIs name, so the
    # entry does not grow with every dependency or compiler change.
    - name: Prepare vcpkg binary cache
      id: vcpkg-binary-prepare
      if: ${{ !cancelled() && steps.vcpkg-binary-cache.outcome == 'success' }}
      shell: bash
      run: |
        temp=$(cygpath -u "$RUNNER_TEMP")
        cache="$temp/vcpkg-binary-cache"
        find "$cache" -name '*.zip' | sort > "$temp/vcpkg-final.txt"
        added=$(comm -13 "$temp/vcpkg-restored.txt" "$temp/vcpkg-final.txt" | wc -l)
        echo "vcpkg stored $added new binary archive(s)"
        if [ "$added" -eq 0 ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "${{ steps.build.outcome }}" = success ]; then
          # vcpkg's package ABI is the SHA-256 of the installed vcpkg_abi_info.txt.
          missing=0
          if ! sha256sum build/vcpkg_installed/*/share/*/vcpkg_abi_info.txt | cut -d' ' -f1 | sort -u > "$temp/vcpkg-abis.txt"; then
            missing=1
          fi
          while read -r abi; do
            [ -f "$cache/${abi:0:2}/$abi.zip" ] || { echo "No archive for ABI $abi"; missing=1; }
          done < "$temp/vcpkg-abis.txt"
          if [ "$missing" -eq 0 ] && [ -s "$temp/vcpkg-abis.txt" ]; then
            while read -r zip; do
              grep -qxF "$(basename "$zip" .zip)" "$temp/vcpkg-abis.txt" || { rm -f "$zip"; echo "Pruned $zip"; }
            done < "$temp/vcpkg-final.txt"
          else
            echo "::warning::Could not match every installed vcpkg ABI to an archive; saving without pruning"
          fi
        fi
        echo "Saving $(find "$cache" -name '*.zip' | wc -l) vcpkg binary archive(s)"
        echo "save=true" >> "$GITHUB_OUTPUT"

    - name: Save vcpkg binary cache
      if: ${{ !cancelled() && steps.vcpkg-binary-prepare.outputs.save == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}

    - name: Trim compiler cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && !inputs.rust-only
      shell: bash
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 1G
      run: '"$CCACHE_EXE" --cleanup'

    - name: Save compiler cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && !inputs.rust-only && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

    - name: Test
      if: ${{ !inputs.cache-only && !inputs.rust-only }}
      shell: bash
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        export CARGO_BUILD_TARGET="$RUST_TARGET"
        cd build
        ctest --show-only=json-v1 > ctest-inventory.json
        python -c 'import json; tests=json.load(open("ctest-inventory.json"))["tests"]; assert tests, "Empty test inventory"; print(f"Discovered {len(tests)} tests")'
        ctest --timeout 120 --output-junit ctest.xml

    - name: Fresh Rust native generators
      if: ${{ !inputs.cache-only && !inputs.rust-only }}
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: clear
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        cmake -S . -B .local/build-tools-windows -GNinja \
          -DOPTION_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch }}-windows-static \
          -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"
        cmake --build .local/build-tools-windows --target tools --parallel 4 -- -d keeprsp

    - name: Validate refusals and actual archive freshness
      if: ${{ !inputs.cache-only && !inputs.rust-only }}
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: clear
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        python tools/check-rust-platform.py --target "$RUST_TARGET" --build build --tools .local/build-tools-windows --output .local/windows-evidence

    - uses: actions/download-artifact@v4
      if: inputs.semantic-subset
      with:
        name: platform-reference
        path: .local/platform-reference

    - name: Compare the platform semantic subset with Linux
      if: inputs.semantic-subset
      shell: bash
      run: python tools/simulate.py platform --stored-reference .local/platform-reference --candidate build/openttd.exe --output .local/platform-semantic

    - uses: actions/upload-artifact@v4
      if: always() && inputs.semantic-subset
      with:
        name: platform-semantic-windows-${{ inputs.arch }}
        path: |
          .local/platform-semantic/report.json
          .local/platform-semantic/validation
        include-hidden-files: true
        if-no-files-found: error

    - name: Retain native Windows Rust and test evidence
      if: always() && !inputs.cache-only
      uses: actions/upload-artifact@v4
      with:
        name: windows-rust-${{ inputs.arch }}-evidence
        include-hidden-files: true
        path: |
          .local/windows-evidence/
          build/ctest-inventory.json
          build/ctest.xml
          build/Testing/Temporary/LastTest.log
          build/CMakeCache.txt
          build/CMakeFiles/CMakeConfigureLog.yaml
          build/compile_commands.json
          build/rust-*.log
          build/rust-*.txt
          build/*.map
          .local/build-tools-windows/CMakeCache.txt
          .local/build-tools-windows/CMakeFiles/CMakeConfigureLog.yaml
          .local/build-tools-windows/compile_commands.json
          .local/build-tools-windows/rust-*.log
          .local/build-tools-windows/rust-*.txt
          .local/build-tools-windows/*.map

    - name: Retain dependency and configure failure logs
      if: failure() && !inputs.cache-only && !inputs.rust-only
      uses: actions/upload-artifact@v4
      with:
        name: windows-vcpkg-${{ inputs.arch }}-logs
        path: |
          ${{ steps.vcpkg.outputs.vcpkg-location }}/buildtrees/**/*.log
          build/vcpkg-manifest-install.log
          build/CMakeFiles/CMakeConfigureLog.yaml
