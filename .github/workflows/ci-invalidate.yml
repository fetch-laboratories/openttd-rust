name: Invalidate previous validation

on:
  pull_request_target:
    branches: [rust-migration]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  invalidate:
    if: vars.CI_ON_DEMAND == 'true'
    runs-on: ubuntu-latest
    # Share the plan/publish lock so a delayed read cannot erase a newer request.
    concurrency:
      group: validation-status-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
    # The protected base defines this job. Never check out the PR here.
    - uses: actions/github-script@v7
      env:
        CI_MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE }}
      with:
        script: |
          const event = context.payload.pull_request;
          const head = event.head.sha;
          const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: event.number});
          if (pull.head.sha !== head) return; // An older synchronize event arrived late.
          const {data: combined} = await github.rest.repos.getCombinedStatusForRef({...context.repo, ref: head});
          const latest = combined.statuses.find(status => status.context === 'Full validation');
          // Never let a delayed invalidation overwrite a request started after this push.
          if (latest && latest.updated_at >= event.updated_at) return;
          // Same non-Markdown inventory rule as the post-merge cache refresh in ci-policy.yml.
          // Markdown that no build reads: AGENTS.md and docs/, except the docs CMake packages for
          // the in-game viewer (tools/test-ci.py checks this list against CMake).
          const builtDocs = ['admin_network', 'debugging_desyncs', 'desync', 'directory_structure', 'eints', 'fonts',
            'game_coordinator', 'linkgraph', 'logging_and_performance_metrics', 'multiplayer', 'savegame_format',
            'symbol_server'];
          const inert = path => typeof path === 'string' && (path === 'AGENTS.md' || path.startsWith('docs/') &&
            path.endsWith('.md') && !builtDocs.some(name => path === `docs/${name}.md`));
          const entries = async sha => {
            const {data} = await github.rest.git.getTree({...context.repo, tree_sha: sha, recursive: 'true'});
            const modes = {'040000': 'tree', '100644': 'blob', '100755': 'blob', '120000': 'blob', '160000': 'commit'};
            if (!data || data.sha !== sha || data.truncated !== false || !Array.isArray(data.tree) || !data.tree.length ||
                data.tree.some(entry => !entry || typeof entry.path !== 'string' || entry.path.includes('\0') ||
                  entry.path.split('/').some(part => !part || part === '.' || part === '..') ||
                  typeof entry.sha !== 'string' || !/^[0-9a-f]{40}$/.test(entry.sha) ||
                  typeof entry.mode !== 'string' || typeof entry.type !== 'string' || modes[entry.mode] !== entry.type) ||
                new Set(data.tree.map(entry => entry.path)).size !== data.tree.length) return null;
            return data.tree.filter(entry => entry.type !== 'tree' && !(entry.type === 'blob' && inert(entry.path)))
              .map(({path, mode, type, sha}) => [path, mode, type, sha]).sort((a, b) => a[0].localeCompare(b[0]));
          };
          // A push that keeps the previous head's Full-tested non-Markdown tree, such as a
          // base update over docs-only commits, inherits that result instead of a new run.
          const carried = async () => {
            const before = context.payload.before;
            if (context.payload.action !== 'synchronize' || !/^[0-9a-f]{40}$/.test(before || '')) return null;
            // Strict protection merges only a head containing its base, so the head tree is the merged tree.
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${pull.base.sha}...${head}`
            });
            if (comparison.behind_by !== 0) return null;
            // Combined statuses omit creators; preserve the gate's GitHub Actions source requirement.
            const previous = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              ...context.repo, ref: before, per_page: 100
            });
            const full = previous.find(status => status.context === 'Full validation');
            const marker = previous.find(status => status.context === 'Validated tree');
            const runPrefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            const run = full?.target_url;
            if (![full, marker].every(status => status?.state === 'success' &&
                  status.creator?.login === 'github-actions[bot]' && status.creator?.type === 'Bot') ||
                typeof run !== 'string' || !run.startsWith(runPrefix) || !/^[1-9][0-9]*$/.test(run.slice(runPrefix.length)) ||
                marker.target_url !== run || !/^[0-9a-f]{40}$/.test(marker.description)) return null;
            const {data: pushed} = await github.rest.repos.getCommit({...context.repo, ref: head});
            const [validated, current] = await Promise.all([entries(marker.description), entries(pushed.commit.tree.sha)]);
            if (validated === null || current === null || JSON.stringify(validated) !== JSON.stringify(current)) return null;
            return {run, tree: marker.description, before};
          };
          let carry = null;
          try {
            carry = await carried();
          } catch (error) {
            core.info(`Carry lookup failed, so the head needs its own run: ${error.message}`);
          }
          if (carry) {
            core.info(`Non-Markdown tree matches ${carry.tree} from ${carry.before}; carry its Full validation`);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, context: 'Full validation', state: 'success', target_url: carry.run,
              description: `Carried from ${carry.before.slice(0, 10)}: non-Markdown tree unchanged`
            });
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, context: 'Validated tree', state: 'success',
              target_url: carry.run, description: carry.tree
            });
            return;
          }
          // The queue runs the group commit's own workflow definitions with write permissions, so in
          // merge-queue mode only a reviewed bootstrap Full admits a PR that changes them. Any doubt
          // counts as a change.
          const definitionsUnchanged = async number => {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: number, per_page: 100
            });
            const definition = path => typeof path !== 'string' || path.startsWith('.github/workflows/');
            // GitHub lists at most 3000 files: fail closed if the list may be truncated.
            return Array.isArray(files) && files.length > 0 && files.length < 3000 && files.every(file =>
              !definition(file?.filename) && (file.previous_filename == null || !definition(file.previous_filename)));
          };
          // Merge-queue mode: Full runs on each merge group, and a PR needs its required checks green
          // to enter the queue, so its head needs no Full of its own. Any doubt leaves it pending.
          const queued = async () => process.env.CI_MERGE_QUEUE === 'true' && await definitionsUnchanged(event.number);
          let queue = false;
          try {
            queue = await queued();
          } catch (error) {
            core.info(`File lookup failed, so the head needs its own run: ${error.message}`);
          }
          if (queue) {
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, context: 'Full validation', state: 'success',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Full runs in the merge queue'
            });
            return;
          }
          await github.rest.repos.createCommitStatus({
            ...context.repo, sha: head, context: 'Full validation', state: 'pending',
            description: 'Request full CI for this PR head before merge'
          });
