name: Migration baseline validation

on:
  push:
    branches: [rust-migration]
    # Docs-only pushes never queue, so they cannot displace a pending code push below. The last
    # pattern that matches a path decides, and together they are the docs-only rule of
    # tools/preflight_stamp.py: a path starts this workflow unless it is docs-only.
    paths:
    - '**'
    - '!AGENTS.md'
    - '!docs/**'
    - 'docs/**.py'
    - 'docs/**.sh'
    - 'docs/admin_network.md'
    - 'docs/debugging_desyncs.md'
    - 'docs/desync.md'
    - 'docs/directory_structure.md'
    - 'docs/eints.md'
    - 'docs/fonts.md'
    - 'docs/game_coordinator.md'
    - 'docs/linkgraph.md'
    - 'docs/logging_and_performance_metrics.md'
    - 'docs/multiplayer.md'
    - 'docs/savegame_format.md'
    - 'docs/symbol_server.md'
    - 'docs/obg_format.txt'
    - 'docs/obm_format.txt'
    - 'docs/obs_format.txt'
    - 'docs/openttd.6'
    - 'docs/elrail_tile.png'
    - 'docs/elrail_track.png'
    - '!.github/PULL_REQUEST_TEMPLATE.md'
    - '!.github/ISSUE_TEMPLATE/**'
    - '!.codex/**'
  pull_request:
    branches: [rust-migration]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
    outputs:
      validated:
        description: Every native build, component comparison and simulation shard succeeded
        value: ${{ jobs.complete.outputs.validated }}

permissions:
  contents: read
  pull-requests: read
  statuses: read

# Protected pushes queue without cancelling the running validation; a newer
# push replaces a pending one, so a burst of merges validates the newest tip.
concurrency:
  group: ${{ github.workflow }}-migration-${{ inputs.checkout-ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/rust-migration' }}

jobs:
  policy:
    if: inputs.checkout-ref == ''
    uses: ./.github/workflows/ci-policy.yml

  build:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true' || needs.policy.outputs.covered == 'true') }}
    runs-on: ${{ vars.CI_LINUX_HEAVY || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.pack.outputs.shards }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/native-environment
      with:
        package-cache: ${{ startsWith(vars.CI_LINUX_HEAVY, 'blacksmith-') }}
    - id: cache
      uses: ./.github/actions/native-cache
    # With CI_QUEUE_SAVES_CACHES the queue's run saves the compiler caches under the group
    # commit it tests, which is the commit the queue then pushes. A covered push whose
    # restore finds that entry itself, for these compilers, has nothing to refresh; one
    # that does not, a failed or evicted save included, refreshes as before.
    - name: Build native Rust generators without the game
      if: needs.policy.outputs.covered != 'true' || steps.cache.outputs.hit != 'true'
      run: python3 tools/migration.py tools --jobs "$(nproc)" --ccache
    - name: Check Rust and compare original and migration builds
      if: needs.policy.outputs.covered != 'true'
      run: python3 tools/migration.py verify --jobs "$(nproc)" --ccache
    - name: Refresh compiler caches for an already validated merged tree
      if: needs.policy.outputs.covered == 'true' && steps.cache.outputs.hit != 'true'
      run: python3 tools/migration.py build --jobs "$(nproc)" --ccache
    - name: Freeze runtime and scenario adapters, then partition the complete inventory
      id: pack
      if: needs.policy.outputs.covered != 'true'
      run: python3 tools/ci_native.py pack --shards 3
    - name: Export frozen runtime and probe build inputs
      if: needs.policy.outputs.covered != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: native-build-inputs
        path: |
          .local/native-runtimes.tar
          .local/native-support.tar
        retention-days: 1
        include-hidden-files: true
        compression-level: 1
    - name: Export frozen native comparison inputs
      if: needs.policy.outputs.covered != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: native-comparison-inputs
        # Comparisons never unpack the frozen runtimes: give them their own
        # copy of the small support archive instead of the runtime bundle.
        path: |
          .local/native-comparison-support.tar
          .local/native-support.tar
        retention-days: 1
        include-hidden-files: true
        compression-level: 1
    - name: Export the mandatory shard plan
      if: needs.policy.outputs.covered != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: native-shard-plan
        path: .local/native-runtimes/shard-plan.json
        include-hidden-files: true
    # The queue's run saves what it compiled, so the push of its commit need not compile it again.
    - name: Save bounded protected-branch compiler caches
      if: success() && (inputs.checkout-ref == '' && github.ref == 'refs/heads/rust-migration' && github.event_name == 'push' && steps.cache.outputs.hit != 'true' || github.event_name == 'merge_group' && vars.CI_QUEUE_SAVES_CACHES == 'true')
      uses: ./.github/actions/native-cache
      with:
        save: 'true'
        prefix: ${{ steps.cache.outputs.prefix }}
    - name: Collect native build evidence
      if: always()
      run: python3 tools/ci_native.py evidence .local/ci-evidence
    - name: Retain native build evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: migration-build-evidence
        path: |
          .local/compiler-cache-identity.json
          .local/ci-evidence
        include-hidden-files: true

  comparisons:
    needs: [policy, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    runs-on: ${{ vars.CI_LINUX_COMPARISONS || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/native-environment
      with:
        package-cache: ${{ startsWith(vars.CI_LINUX_COMPARISONS, 'blacksmith-') }}
    - uses: actions/download-artifact@v4
      with:
        name: native-comparison-inputs
        path: .local/native-inputs
    - name: Restore frozen native probe inputs
      run: |
        python3 tools/ci_native.py unpack .local/native-inputs/native-support.tar
        python3 tools/ci_native.py unpack .local/native-inputs/native-comparison-support.tar
    - name: Compare every migrated component with the pinned original
      run: python3 tools/run-comparisons.py --jobs "$(nproc)"
    - name: Collect component evidence
      if: always()
      run: python3 tools/ci_native.py evidence .local/ci-evidence
    - name: Retain component evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: migration-comparison-evidence
        path: .local/ci-evidence
        include-hidden-files: true

  simulation:
    needs: [policy, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    runs-on: ${{ vars.CI_LINUX_SIMULATION || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/native-environment
      with:
        package-cache: ${{ startsWith(vars.CI_LINUX_SIMULATION, 'blacksmith-') }}
    - uses: actions/download-artifact@v4
      with:
        name: native-build-inputs
        path: .local/native-inputs
    - name: Restore frozen runtimes and narrow probe build inputs
      run: |
        tar -xf .local/native-inputs/native-runtimes.tar -C .local
        python3 tools/ci_native.py unpack .local/native-inputs/native-support.tar
    - name: Cache pinned community source packages
      uses: actions/cache@v4
      with:
        path: .local/community-ai
        key: community-ai-${{ hashFiles('migration/community-ai/packages.json') }}
    - name: Validate required community inputs
      run: python3 -m tools.simulation.community_ai fetch
    - name: Compare assigned simulation inventory
      run: python3 tools/ci_native.py shard ${{ matrix.shard }} --jobs "$(nproc)" --output .local/shard-${{ matrix.shard }}-${{ github.run_attempt }}.json
    - name: Collect simulation evidence
      if: always()
      run: python3 tools/ci_native.py evidence .local/ci-evidence
    - name: Retain shard report and evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Each attempt keeps its own report: a rerun's latest passes, and an
        # earlier attempt's failure remains for flake reports (#881).
        name: migration-simulation-${{ matrix.shard }}-${{ github.run_attempt }}
        path: |
          .local/shard-${{ matrix.shard }}-${{ github.run_attempt }}.json
          .local/ci-evidence
        include-hidden-files: true

  complete:
    needs: [policy, build, comparisons, simulation]
    if: ${{ always() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.validated.outputs.validated }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Require every native job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = [job for job in ('build', 'comparisons', 'simulation') if results.get(job, {}).get('result') != 'success']
        if failed:
            raise SystemExit(f'Required native jobs failed, skipped or cancelled: {failed}')
        PY
    - uses: actions/download-artifact@v4
      with:
        name: native-shard-plan
        path: .local/native-runtimes
    - uses: actions/download-artifact@v4
      with:
        pattern: migration-simulation-*
        path: .local/shard-reports
        merge-multiple: true
    - name: Require exactly the complete scenario inventory
      id: validated
      run: |
        python3 tools/ci_native.py report .local/shard-reports
        echo 'validated=true' >> "$GITHUB_OUTPUT"
