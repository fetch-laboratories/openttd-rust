name: CI (Emscripten)

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      cache-only:
        required: false
        type: boolean
        default: false

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  emscripten:
    name: CI

    runs-on: ubuntu-latest
    container:
      # If you change this version, change the numbers in the cache step
      # and os/emscripten/Dockerfile too.
      image: emscripten/emsdk:4.0.23

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref }}
        persist-credentials: false

    - name: Fix dubious ownership
      run: |
        git config --global --add safe.directory ${GITHUB_WORKSPACE}

    # Canonical's archive timed out from this container three times in 30 minutes on
    # 2026-11-09 (#833, #841). Use the Azure mirror GitHub's runner images use, with retries.
    - name: Update to modern GCC
      run: |
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
          if [ -f "$f" ]; then sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' "$f"; fi
        done
        apt-get -o Acquire::Retries=5 update
        apt-get -o Acquire::Retries=5 install -y gcc-12 g++-12
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

    - name: Install compiler cache
      run: |
        apt-get -o Acquire::Retries=5 install -y ccache
        ccache --version | head -n 1

    # The container sees a different runner temp path than expressions report, so
    # the compiler cache lives at a fixed container path.
    - name: Restore compiler cache
      id: compiler-cache
      uses: actions/cache/restore@v4
      with:
        path: /ccache
        key: ccache-emscripten-v1-4.0.23-${{ hashFiles('migration/ccache.conf') }}-${{ inputs.checkout-ref || github.sha }}
        restore-keys: ccache-emscripten-v1-4.0.23-${{ hashFiles('migration/ccache.conf') }}-

    - name: Setup cache
      uses: actions/cache@v4
      with:
        # If you change this version, change the numbers in the image configuration step
        # and os/emscripten/Dockerfile too.
        path: /emsdk/upstream/emscripten/cache
        key: 4.0.23-${{ runner.os }}

    # cmake/Rust.cmake requires the rust-toolchain.toml channel. The host tools link the host
    # standard library and the game links the wasm32-unknown-emscripten one.
    - name: Install Rust
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        apt-get install -y curl
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path \
          --profile minimal --default-toolchain "$channel" --component rustfmt,clippy --target wasm32-unknown-emscripten
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/rustc" -vV

    - name: Add liblzma support
      run: |
        cp ${GITHUB_WORKSPACE}/os/emscripten/ports/liblzma.py /emsdk/upstream/emscripten/tools/ports/contrib/

    - name: Build (host tools)
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake .. -DOPTION_TOOLS_ONLY=ON
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc) --target tools
        echo "::endgroup::"

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Fetch pinned native-test oracle headers
      shell: bash
      run: |
        baseline=$(sed -n 's/  "commit": "\(.*\)"/\1/p' migration/baseline.json)
        git fetch --no-tags --depth=1 origin "$baseline"

    # emcc runs EM_COMPILER_WRAPPER before its clang, so ccache sees ordinary clang
    # compiles. Precompiled headers stay off, as in the cached GCC flavours.
    - name: Build
      env:
        EM_COMPILER_WRAPPER: ccache
        CCACHE_DIR: /ccache
        CCACHE_MAXSIZE: 500M
      run: |
        export CCACHE_CONFIGPATH="$GITHUB_WORKSPACE/migration/ccache.conf" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
        ccache -z
        mkdir build
        cd build

        echo "::group::CMake"
        emcmake cmake .. -DHOST_BINARY_DIR=../build-host -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc) --target openttd openttd_rust_abi
        echo "::endgroup::"
        ccache -s

    # emcmake sets emsdk's node as the CTest emulator.
    - name: Test Rust ABI
      if: ${{ !inputs.cache-only }}
      run: |
        cd build
        ctest -R rust-abi-layout-and-calls --no-tests=error --output-on-failure

    - name: Trim compiler cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration'
      env:
        CCACHE_DIR: /ccache
        CCACHE_MAXSIZE: 500M
      run: CCACHE_CONFIGPATH="$GITHUB_WORKSPACE/migration/ccache.conf" ccache --cleanup

    - name: Save compiler cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
