name: Quick validation

on:
  pull_request:
    branches: [rust-migration]
  push:
    branches: [rust-migration]
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      base-ref:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quick-ci-${{ inputs.checkout-ref && github.run_id || github.ref == 'refs/heads/rust-migration' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/rust-migration' }}

jobs:
  quick:
    name: Quick validation
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.18"
    - name: Install pinned Rust compiler
      run: |
        channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
    - name: Rust formatting, check, warnings and tests
      run: python3 tools/migration.py rust-checks --jobs 2
    - name: Force-warn Rust lint debt ratchet
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/lint-ratchet.py clippy --base-ref "$BASE_REF"
    # Inline, not the shared apt-install action: on a pull request this job checks out
    # the PR head, and a branch older than a local action does not contain it. #862
    # used the action here, and Quick then failed on every such branch (#863).
    - name: Install nested collection probe dependency
      run: |
        options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        install=(install -y --no-install-recommends valgrind)
        for attempt in 1 2; do
          if sudo timeout 60 apt-get "${options[@]}" update && sudo timeout 60 apt-get "${options[@]}" "${install[@]}"; then
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed or stalled; retrying without the Azure mirror"
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        done
        sudo apt-get "${options[@]}" update
        sudo apt-get "${options[@]}" "${install[@]}"
    - name: Python formatting, lint and maintenance regression checks
      run: |
        uvx --from ruff==0.16.8 ruff check tools/
        uvx --from ruff==0.16.8 ruff format --check tools/
        uvx ty@0.0.92 check
        python3 - <<'PY'
        from pathlib import Path
        import subprocess
        for test in sorted(Path('tools').glob('test-*.py')):
            print(f'Running {test}', flush=True)
            subprocess.run(['python3', str(test)], check=True)
        PY
    - name: Python complexity debt and lint policy
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: |
        python3 tools/lint-ratchet.py ruff --base-ref "$BASE_REF"
        python3 tools/lint-policy.py --base-ref "$BASE_REF"
    - name: Reject independent native and boundary growth
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/growth-ratchet.py --base-ref "$BASE_REF"
    - name: Prove claimed release Rust refactors
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/refactor-proof.py --base-ref "$BASE_REF"
    - name: Reject Rust C bool returns
      run: python3 tools/ffi-bool-returns.py
    - name: Reject source build fallbacks
      run: python3 tools/rust-only.py
    - name: Reject new shared accessor copies
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/shared-accessors.py --base-ref "$BASE_REF"
    - name: Reject orphan Rust exports and declarations
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/orphan-exports.py --base-ref "$BASE_REF"
    - name: Reject rebound service-table callees
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/rebound-callees.py --base-ref "$BASE_REF"
    - name: Reject lost scenarios, comparisons and cases or grown masks
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 tools/harness_inventory.py --base-ref "$BASE_REF"
    - name: Check strings and script mode enforcement
      run: |
        python3 .github/unused-strings.py
        python3 .github/script-missing-mode-enforcement.py
    - name: Checkout inherited commit hooks
      if: inputs.base-ref != ''
      uses: actions/checkout@v6
      with:
        repository: OpenTTD/OpenTTD-git-hooks
        ref: eeb3791aadf0aded5a7cd634c80823f17e87af9c
        path: .local/commit-hooks
        persist-credentials: false
    - name: Check every introduced commit against captured base
      if: inputs.base-ref != ''
      env:
        BASE: ${{ inputs.base-ref }}
        HEAD: ${{ inputs.checkout-ref }}^2
      run: |
        hooks="$GITHUB_WORKSPACE/.local/commit-hooks"
        echo "::add-matcher::$hooks/action/check-diff-matcher.json"
        echo "::add-matcher::$hooks/action/check-message-matcher.json"
        HOOKS_DIR="$hooks/hooks" GIT_DIR="$(git rev-parse --absolute-git-dir)" sh "$hooks/hooks/check-commits.sh" "$BASE..$HEAD"
