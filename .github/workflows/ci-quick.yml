name: Quick validation

on:
  # A draft PR's checkpoints run no Quick; marking it ready runs Quick on its head (#920).
  pull_request:
    branches: [rust-migration]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [rust-migration]
  # A required check must report on each merge group too; Full calls this workflow there.
  merge_group:
    branches: [rust-migration]
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      base-ref:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quick-ci-${{ inputs.checkout-ref && github.run_id || github.ref == 'refs/heads/rust-migration' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/rust-migration' }}

jobs:
  quick:
    name: Quick validation
    if: >-
      inputs.checkout-ref != '' || github.event_name == 'push' ||
      github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.18"
    - name: Install pinned Rust compiler
      run: |
        channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
    - name: Rust formatting, check, warnings and tests
      run: python3 tools/migration.py rust-checks --jobs 2
    - name: Force-warn Rust lint debt ratchet
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/lint-ratchet.py clippy --base-ref "$BASE_REF"
    # The shared apt-install action's script, inline: on a pull request this job checks
    # out the PR head, and a branch older than a local action does not contain it. #862
    # used the action here, and Quick then failed on every such branch (#863).
    # tools/test-ci.py keeps this script identical to the action's.
    - name: Install nested collection probe dependency
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGES: valgrind
        RECOMMENDS: 'false'
      run: |
        # A mirror can stall without failing: on 2026-11-24 GitHub's hosted runners
        # installed from us-east-2.ec2.archive.ubuntu.com in a median 5.1 minutes, the
        # longest 20.2, while Emscripten's jobs on the same pool, pointed at Azure, took
        # at most 0.2. Azure and Canonical's archive have each stalled before too (#858,
        # #833, #841). The first two attempts get 60 seconds per command, and each failed
        # attempt moves to a host not yet tried: the configured mirror (a mirror list's
        # first by priority), then Azure, then Canonical's archive. Every archive URL the
        # sources name (mirror lists, `URIs:` and `deb` lines) moves to it, so no other
        # entry of a list stays in front. With only two hosts the last attempt stays on
        # the second, never returning to the one that stalled. The last attempt has no bound
        # of its own, as the plain install had none: a slow install beats a failed job,
        # and the calling job's own limit still applies. apt keeps what an interrupted
        # attempt downloaded.
        sudo=$(command -v sudo || true)
        read -r -a packages <<< "$PACKAGES"
        options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        install=(install -y)
        if [ "$RECOMMENDS" != true ]; then
          # Recommended desktop packages (GTK, Vulkan drivers) only slow every job.
          install+=(--no-install-recommends)
        fi
        $sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
        shopt -s nullglob
        files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list)
        shopt -u nullglob
        # The mirror lists the sources name, in order; Blacksmith's is not apt-mirrors.txt.
        lists=()
        while read -r list; do
          if [ -f "$list" ] && [[ " ${lists[*]} " != *" $list "* ]]; then
            lists+=("$list")
          fi
        done < <({ cat "${files[@]}" 2>/dev/null || true; } | grep -o 'mirror+file:[^[:space:]]*' | sed 's/^mirror+file://'; echo /etc/apt/apt-mirrors.txt)
        sources() {
          { cat "${lists[@]}" "${files[@]}" 2>/dev/null || true; } | sha256sum
        }
        # The configured mirror: a mirror list's first archive host by priority, else the
        # sources' first.
        configured=$({ cat "${lists[@]}" /dev/null 2>/dev/null || true; } | awk '
          /^[[:space:]]*#/ { next }
          match($0, /https?:\/\/[^\/[:space:]]+\/ubuntu/) {
            host = substr($0, RSTART, RLENGTH)
            sub(/^https?:\/\//, "", host)
            sub(/\/ubuntu$/, "", host)
            if (host == "security.ubuntu.com") next
            rank = 1e9
            if (match($0, /priority:[0-9]+/)) rank = substr($0, RSTART + 9, RLENGTH - 9) + 0
            if (best == "" || rank < low) { best = host; low = rank }
          }
          END { print best }')
        if [ -z "$configured" ]; then
          configured=$({ cat "${files[@]}" 2>/dev/null || true; } |
            sed -n 's|^\([^#]*[[:space:]]\)\{0,1\}https\{0,1\}://\([^/[:space:]]*\)/ubuntu.*|\2|p' |
            grep -v '^security\.ubuntu\.com$' | head -n 1 || true)
        fi
        # The archive hosts a retry moves off: every one an active entry names, in any
        # mirror list or source, and Ubuntu's.
        archives="([a-z0-9-]+\\.)*archive\\.ubuntu\\.com"
        while read -r host; do
          archives+="|${host//./\\.}"
        done < <({ cat "${lists[@]}" "${files[@]}" 2>/dev/null || true; } |
          grep -v '^[[:space:]]*#' | grep -o 'https\{0,1\}://[^/[:space:]]*/ubuntu' |
          sed 's|^https\{0,1\}://||; s|/ubuntu$||' | grep -v '^security\.ubuntu\.com$' | sort -u)
        hosts=()
        if [ -n "$configured" ]; then
          for host in "$configured" azure.archive.ubuntu.com archive.ubuntu.com; do
            if [[ " ${hosts[*]} " != *" $host "* ]]; then
              hosts+=("$host")
            fi
          done
        fi
        current=0
        updated=false
        for attempt in 1 2 3; do
          bounded=($sudo timeout 60)
          if [ "$attempt" = 3 ]; then
            bounded=($sudo)
          fi
          if [ "$updated" = false ] && "${bounded[@]}" apt-get "${options[@]}" update; then
            updated=true
          fi
          if [ "$updated" = true ] &&
             "${bounded[@]}" apt-get "${options[@]}" "${install[@]}" --download-only "${packages[@]}"; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            exit 1
          fi
          before=$(sources)
          stalled=${hosts[current]:-the configured mirror}
          if [ $((current + 1)) -lt "${#hosts[@]}" ]; then
            current=$((current + 1))
            for file in "${lists[@]}" "${files[@]}"; do
              if [ -f "$file" ]; then
                $sudo sed -E -i "s#https?://($archives)/ubuntu#http://${hosts[current]}/ubuntu#g" "$file"
              fi
            done
          fi
          echo "::warning::apt attempt $attempt failed or stalled on $stalled; retrying on ${hosts[current]:-the same sources}"
          # An index fetched from the sources still in use stays valid.
          if [ "$(sources)" != "$before" ]; then
            updated=false
          fi
        done
        $sudo apt-get "${options[@]}" "${install[@]}" "${packages[@]}"
    - name: Python formatting, lint and maintenance regression checks
      run: |
        uvx --from ruff==0.16.8 ruff check tools/
        uvx --from ruff==0.16.8 ruff format --check tools/
        uvx ty@0.0.92 check
        python3 - <<'PY'
        from pathlib import Path
        import subprocess
        for test in sorted(Path('tools').glob('test-*.py')):
            print(f'Running {test}', flush=True)
            subprocess.run(['python3', str(test)], check=True)
        PY
    - name: Python complexity debt and lint policy
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: |
        python3 tools/lint-ratchet.py ruff --base-ref "$BASE_REF"
        python3 tools/lint-policy.py --base-ref "$BASE_REF"
    # Growth whose proposal awaits its reviewer's acceptance passes as pending review
    # and fails only in the merge group (#921). Called from Full, the event is the caller's.
    - name: Reject independent native and boundary growth
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/growth-ratchet.py --base-ref "$BASE_REF" --event "${GITHUB_EVENT_NAME:-pull_request}"
    - name: Prove claimed release Rust refactors
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/refactor-proof.py --base-ref "$BASE_REF"
    - name: Reject Rust C bool returns
      run: python3 tools/ffi-bool-returns.py
    - name: Reject source build fallbacks
      run: python3 tools/rust-only.py
    - name: Reject new shared accessor copies
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/shared-accessors.py --base-ref "$BASE_REF"
    - name: Reject orphan Rust exports and declarations
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/orphan-exports.py --base-ref "$BASE_REF"
    - name: Reject new residue in finished files
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/code-standards-inventory.py --gate "$BASE_REF"
    - name: Reject rebound service-table callees
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
      run: python3 tools/rebound-callees.py --base-ref "$BASE_REF"
    - name: Reject lost scenarios, comparisons and cases or grown masks
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 tools/harness_inventory.py --base-ref "$BASE_REF"
    - name: Check strings and script mode enforcement
      run: |
        python3 .github/unused-strings.py
        python3 .github/script-missing-mode-enforcement.py
    - name: Checkout inherited commit hooks
      if: inputs.base-ref != ''
      uses: actions/checkout@v6
      with:
        repository: OpenTTD/OpenTTD-git-hooks
        ref: eeb3791aadf0aded5a7cd634c80823f17e87af9c
        path: .local/commit-hooks
        persist-credentials: false
    - name: Check every introduced commit against captured base
      if: inputs.base-ref != ''
      env:
        BASE: ${{ inputs.base-ref }}
        HEAD: ${{ inputs.checkout-ref }}^2
      run: |
        hooks="$GITHUB_WORKSPACE/.local/commit-hooks"
        echo "::add-matcher::$hooks/action/check-diff-matcher.json"
        echo "::add-matcher::$hooks/action/check-message-matcher.json"
        HOOKS_DIR="$hooks/hooks" GIT_DIR="$(git rev-parse --absolute-git-dir)" sh "$hooks/hooks/check-commits.sh" "$BASE..$HEAD"
