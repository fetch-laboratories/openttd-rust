name: CI - Build

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      profile:
        required: true
        type: string
    outputs:
      validated:
        description: All selected builds and annotation checks succeeded
        value: ${{ jobs.complete.outputs.validated }}
  pull_request:
  push:
    branches:
    - master
    - rust-migration
    # Markdown-only pushes never queue, so they cannot displace a pending code push below.
    paths-ignore: ['**.md']
  # Root runs the cadence platforms after every fifth integration (#357, #514).
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

# Protected pushes queue without cancelling the running validation; a newer
# push replaces a pending one, so a burst of merges validates the newest tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-build-${{ inputs.checkout-ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/rust-migration' }}

jobs:
  policy:
    if: inputs.checkout-ref == '' && github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/ci-policy.yml

  emscripten:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') && inputs.profile != 'native' }}
    name: Emscripten

    uses: ./.github/workflows/ci-emscripten.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  linux:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true' || needs.policy.outputs.covered == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON((inputs.profile == 'platform' || (github.event_name == 'push' && needs.policy.outputs.heavy == 'true')) && '["clang","sdl2","dedicated"]' || (inputs.checkout-ref == '' && github.event_name == 'workflow_dispatch') && '["clang","dedicated"]' || '["sdl2"]') }}

    name: Linux (${{ matrix.flavour == 'clang' && 'Clang' || matrix.flavour == 'dedicated' && 'GCC - Dedicated' || 'GCC - SDL2' }})

    uses: ./.github/workflows/ci-linux.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      compiler: ${{ matrix.flavour == 'clang' && 'clang' || 'gcc' }}
      cxxcompiler: ${{ matrix.flavour == 'clang' && 'clang++' || 'g++' }}
      libraries: ${{ matrix.flavour == 'dedicated' && 'grfcodec' || 'libsdl2-dev' }}
      extra-cmake-parameters: ${{ matrix.flavour == 'dedicated' && '-DOPTION_DEDICATED=ON -DCMAKE_CXX_FLAGS_INIT="-DRANDOM_DEBUG" -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON' || '' }}
      cache-only: ${{ inputs.checkout-ref == '' && github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && needs.policy.outputs.covered == 'true' }}

  macos:
    needs: policy
    # Full validation and covered pushes skip macOS (#357).
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true' || github.event_name == 'workflow_dispatch') && inputs.profile != 'native' && inputs.profile != 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: arm64 - Debug
          arch: arm64
          full_arch: arm64
          extra-cmake-parameters: -DCMAKE_BUILD_TYPE=Debug -DOPTION_USE_ASSERTS=ON
        - name: arm64 - Release
          arch: arm64
          full_arch: arm64
          extra-cmake-parameters: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=OFF

    name: Mac OS (${{ matrix.name }})

    uses: ./.github/workflows/ci-macos.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      rust: true
      arch: ${{ matrix.arch }}
      full_arch: ${{ matrix.full_arch }}
      extra-cmake-parameters: ${{ matrix.extra-cmake-parameters }}

  windows:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true' || needs.policy.outputs.covered == 'true' || github.event_name == 'workflow_dispatch') && inputs.profile != 'native' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.profile == 'platform' || (github.event_name == 'push' && needs.policy.outputs.heavy == 'true')) && '["x86","x64"]' || (inputs.checkout-ref == '' && github.event_name == 'workflow_dispatch') && '["x86"]' || '["x64"]') }}

    name: Windows (${{ matrix.arch }})

    uses: ./.github/workflows/ci-windows.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      rust: true
      arch: ${{ matrix.arch }}
      cache-only: ${{ inputs.checkout-ref == '' && github.event_name == 'push' && github.ref == 'refs/heads/rust-migration' && needs.policy.outputs.covered == 'true' }}

  annotations_emscripten:
    name: Check emscripten annotations
    needs: emscripten
    if: always() && needs.emscripten.result != 'skipped' && (inputs.checkout-ref != '' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
    - uses: OpenTTD/actions/annotation-check@v6

  annotations_linux:
    name: Check linux annotations
    needs: linux
    if: always() && needs.linux.result != 'skipped' && (inputs.checkout-ref != '' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
    - uses: OpenTTD/actions/annotation-check@v6

  annotations_macos:
    name: Check macos annotations
    needs: macos
    if: always() && needs.macos.result != 'skipped' && (inputs.checkout-ref != '' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
    - uses: OpenTTD/actions/annotation-check@v6

  annotations_windows:
    name: Check windows annotations
    needs: windows
    if: always() && needs.windows.result != 'skipped' && (inputs.checkout-ref != '' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
    - uses: OpenTTD/actions/annotation-check@v6

  check_annotations:
    name: Check Annotations
    needs:
    - emscripten
    - linux
    - macos
    - windows
    - annotations_emscripten
    - annotations_linux
    - annotations_macos
    - annotations_windows

    if: always() && (inputs.checkout-ref != '' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.linux.result != 'skipped'))

    runs-on: ubuntu-latest

    steps:
    - name: Check annotations
      uses: OpenTTD/actions/annotation-check@v6

  complete:
    if: always() && inputs.checkout-ref != ''
    needs: [emscripten, linux, macos, windows, check_annotations, annotations_emscripten, annotations_linux, annotations_macos, annotations_windows]
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
    steps:
    - id: complete
      env:
        PROFILE: ${{ inputs.profile }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        results = json.loads(os.environ['RESULTS'])
        required = ['linux', 'check_annotations']
        if os.environ['PROFILE'] == 'platform':
            required += ['emscripten', 'macos', 'windows']
        elif os.environ['PROFILE'] == 'full':
            required += ['emscripten', 'windows']
        elif os.environ['PROFILE'] != 'native':
            raise SystemExit('Unsupported platform profile')
        required += [f'annotations_{job}' for job in required if job != 'check_annotations']
        failed = [job for job in required if results.get(job, {}).get('result') != 'success']
        if failed:
            raise SystemExit(f'Required builds/checks did not succeed: {failed}')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('validated=true\n')
        PY
