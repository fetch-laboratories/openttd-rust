name: Requested validation
run-name: CI ${{ inputs.profile || 'full' }} ${{ github.event_name == 'merge_group' && format('queue {0}', github.event.merge_group.head_ref) || format('PR {0} {1}', inputs.pr || github.event.pull_request.number, inputs.request || format('bootstrap-{0}', github.run_id)) }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head:
        description: Captured immutable pull request head SHA
        required: true
        type: string
      profile:
        description: Validation scope (only full can satisfy the merge gate)
        required: true
        type: choice
        options: [rust, native, platform, full]
      request:
        description: Unique request identifier from tools/ci.py
        required: true
        type: string
  # Workflow updates: root reviews the definition and temporarily unsets CI_ON_DEMAND.
  pull_request:
    branches: [rust-migration]
    types: [labeled]
  # Merge-queue mode: the queue tests each group commit, the base plus the PRs ahead plus this PR (#860).
  merge_group:
    branches: [rust-migration]

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

# A merge-group run is never cancelled: a group rebuilt on a new base adopts it.
concurrency:
  group: requested-ci-${{ github.event_name == 'merge_group' && format('queue-{0}', github.run_id) || inputs.pr || github.event.pull_request.number }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rust-migration') ||
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/rust-migration') ||
      (github.event_name == 'pull_request' && vars.CI_ON_DEMAND != 'true' &&
       github.event.label.name == 'ci:full' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Serialize status reads/writes with earlier publishers for this PR. Native
    # and platform jobs remain independent across requested profiles. A merge
    # group writes only its own group commit, so it needs no shared lock.
    concurrency:
      group: validation-status-${{ github.event_name == 'merge_group' && format('queue-{0}', github.run_id) || inputs.pr || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      merge: ${{ steps.plan.outputs.merge }}
      tree: ${{ steps.plan.outputs.tree }}
      profile: ${{ steps.plan.outputs.profile }}
      pr: ${{ steps.plan.outputs.pr }}
      checker: ${{ steps.plan.outputs.checker }}
      carried: ${{ steps.plan.outputs.carried }}
      carried-tree: ${{ steps.plan.outputs.carried-tree }}
    steps:
    # No checkout: this publisher executes only the reviewed workflow definition.
    - id: plan
      uses: actions/github-script@v7
      env:
        PR: ${{ inputs.pr || github.event.pull_request.number }}
        HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
        PROFILE: ${{ inputs.profile || 'full' }}
        CI_MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE }}
      with:
        script: |
          // A merge group tests its own commit, whose second parent is the queued PR's head.
          const queue = context.eventName === 'merge_group';
          const group = queue ? context.payload.merge_group : null;
          const queued = /^refs\/heads\/gh-readonly-queue\/rust-migration\/pr-([1-9][0-9]*)-[0-9a-f]{40}$/
            .exec(group?.head_ref || '');
          const pr = Number(queue ? queued?.[1] : process.env.PR);
          const profile = process.env.PROFILE;
          let head = queue ? null : process.env.HEAD;
          if (!Number.isSafeInteger(pr) || pr <= 0 || !/^[0-9a-f]{40}$/.test(queue ? group?.head_sha : head) ||
              !['rust', 'native', 'platform', 'full'].includes(profile) || queue && profile !== 'full') {
            throw new Error('Invalid validation request');
          }
          const actor = await github.rest.repos.getCollaboratorPermissionLevel({
            ...context.repo, username: context.actor
          });
          if (!['admin', 'maintain', 'write'].includes(actor.data.permission)) {
            throw new Error('Validation requests require repository write permission');
          }
          const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: pr});
          if (pull.state !== 'open' || pull.base.ref !== 'rust-migration' || !queue && pull.head.sha !== head) {
            throw new Error('Pull request is closed, targets another branch, or its head changed');
          }
          if (!queue && (pull.mergeable !== true || !/^[0-9a-f]{40}$/.test(pull.merge_commit_sha || ''))) {
            throw new Error('Pull request is unmergeable or mergeability is pending; retry after resolving it');
          }
          // The queue runs the group commit's own workflow definitions with write permissions, so in
          // merge-queue mode only a reviewed bootstrap Full admits a PR that changes them. Any doubt
          // counts as a change.
          const definitionsUnchanged = async number => {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: number, per_page: 100
            });
            const definition = path => typeof path !== 'string' || path.startsWith('.github/workflows/');
            // GitHub lists at most 3000 files: fail closed if the list may be truncated.
            return Array.isArray(files) && files.length > 0 && files.length < 3000 && files.every(file =>
              !definition(file?.filename) && (file.previous_filename == null || !definition(file.previous_filename)));
          };
          // An ordinary Full's success on such a head would admit it to the queue unreviewed.
          if (context.eventName === 'workflow_dispatch' && profile === 'full' && process.env.CI_MERGE_QUEUE === 'true' &&
              !await definitionsUnchanged(pr)) {
            throw new Error('In merge-queue mode a PR changing .github/workflows/ needs the reviewed bootstrap Full');
          }
          const merge = queue ? group.head_sha : pull.merge_commit_sha;
          const {data: tested} = await github.rest.repos.getCommit({...context.repo, ref: merge});
          if (queue) {
            head = pull.head.sha;
            if (tested.parents?.length !== 2 || tested.parents[1]?.sha !== head) {
              throw new Error('The merge group commit does not merge the current PR head');
            }
          }
          // Only Quick reads these checker scripts and debt records, and no build reads
          // inert Markdown. A full request whose merge changes nothing else runs Quick
          // alone. The base's post-merge run still builds the tree.
          const checkerPaths = new RegExp('^(tools/(lint-ratchet|lint-policy|growth-ratchet|refactor-proof|' +
            'baseline_ratchet|cleanup_contract|test-cleanup-checks)\\.py|' +
            'migration/(clippy-debt|ruff-debt)\\.json|migration/lints/clippy\\.toml)$');
          // Markdown that no build reads: AGENTS.md and docs/, except the docs CMake packages for
          // the in-game viewer (tools/test-ci.py checks this list against CMake).
          const builtDocs = ['admin_network', 'debugging_desyncs', 'desync', 'directory_structure', 'eints', 'fonts',
            'game_coordinator', 'linkgraph', 'logging_and_performance_metrics', 'multiplayer', 'savegame_format',
            'symbol_server'];
          const inert = path => typeof path === 'string' && (path === 'AGENTS.md' || path.startsWith('docs/') &&
            path.endsWith('.md') && !builtDocs.some(name => path === `docs/${name}.md`));
          const entries = async sha => {
            const {data} = await github.rest.git.getTree({...context.repo, tree_sha: sha, recursive: 'true'});
            const modes = {'040000': 'tree', '100644': 'blob', '100755': 'blob', '120000': 'blob', '160000': 'commit'};
            if (!data || data.sha !== sha || data.truncated !== false || !Array.isArray(data.tree) || !data.tree.length ||
                data.tree.some(entry => !entry || typeof entry.path !== 'string' || entry.path.includes('\0') ||
                  entry.path.split('/').some(part => !part || part === '.' || part === '..') ||
                  typeof entry.sha !== 'string' || !/^[0-9a-f]{40}$/.test(entry.sha) ||
                  typeof entry.mode !== 'string' || typeof entry.type !== 'string' || modes[entry.mode] !== entry.type) ||
                new Set(data.tree.map(entry => entry.path)).size !== data.tree.length) return null;
            return data.tree.filter(entry => entry.type !== 'tree' && !(entry.type === 'blob' && inert(entry.path)))
              .map(({path, mode, type, sha}) => [path, mode, type, sha]).sort((a, b) => a[0].localeCompare(b[0]));
          };
          const quickOnly = path => typeof path === 'string' && (checkerPaths.test(path) || inert(path));
          let checker = false;
          // Classify exactly what the captured merge changes against its own first parent,
          // never the mutable PR file list or a base that may have moved since GitHub merged.
          const parent = tested.parents?.[0]?.sha;
          if (profile === 'full' && /^[0-9a-f]{40}$/.test(parent || '')) {
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${parent}...${merge}`
            });
            // GitHub caps comparison files at 300: fail closed if the list may be truncated.
            const files = comparison?.files;
            checker = comparison?.merge_base_commit?.sha === parent && Array.isArray(files) &&
              files.length > 0 && files.length < 300 && files.every(file =>
                quickOnly(file?.filename) && (file.previous_filename == null || quickOnly(file.previous_filename)));
          }
          const runPrefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
          if (profile === 'full') {
            // A merge group's result goes on the group commit, which the queue merges.
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: queue ? merge : head, context: 'Full validation', state: 'pending',
              target_url: `${runPrefix}${context.runId}`,
              description: queue ? `Merge queue validation for PR #${pr}` : `Full validation requested for PR #${pr}`
            });
          }
          // Carried validation for merge groups: a direct push to the base rebuilds every queued
          // group and starts a new run, while the earlier run keeps going. When an earlier group of
          // this PR head has the same non-Markdown tree, wait for its run and publish its passing
          // result instead of repeating it. Any doubt runs this group normally.
          const adopted = async () => {
            const current = await entries(tested.commit.tree.sha);
            if (current === null) return null;
            const {data: listed} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci-request.yml', event: 'merge_group', per_page: 100
            });
            const earlier = listed.workflow_runs.filter(run => run.id < context.runId && run.event === 'merge_group' &&
                run.head_branch?.startsWith(`gh-readonly-queue/rust-migration/pr-${pr}-`) &&
                /^[0-9a-f]{40}$/.test(run.head_sha) && (run.status !== 'completed' || run.conclusion === 'success'))
              .sort((a, b) => a.id - b.id);
            // The longest Full takes about 30 minutes; an earlier run still going after this runs here.
            const deadline = Date.now() + 45 * 60 * 1000;
            for (const candidate of earlier) {
              const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref: candidate.head_sha});
              if (commit.parents?.length !== 2 || commit.parents[1]?.sha !== head) continue;
              const same = await entries(commit.commit.tree.sha);
              if (same === null || JSON.stringify(same) !== JSON.stringify(current)) continue;
              let run = candidate;
              while (run.status !== 'completed' && Date.now() < deadline) {
                core.info(`Waiting for run ${run.id}, which tests the same non-Markdown tree`);
                await new Promise(resolve => setTimeout(resolve, 30000));
                ({data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: candidate.id}));
              }
              if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== candidate.head_sha) continue;
              // Combined statuses omit creators; only the publisher's own statuses qualify.
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                ...context.repo, ref: candidate.head_sha, per_page: 100
              });
              const full = statuses.find(status => status.context === 'Full validation');
              const marker = statuses.find(status => status.context === 'Validated tree');
              const url = full?.target_url;
              if (![full, marker].every(status => status?.state === 'success' &&
                    status.creator?.login === 'github-actions[bot]' && status.creator?.type === 'Bot') ||
                  typeof url !== 'string' || !url.startsWith(runPrefix) || !/^[1-9][0-9]*$/.test(url.slice(runPrefix.length)) ||
                  marker.target_url !== url || !/^[0-9a-f]{40}$/.test(marker.description)) continue;
              // The result names the run that built its tree: this candidate, or, through a chain of
              // carries, an older successful merge-group run of this workflow for the same PR head
              // whose group tree is the marker's.
              const origin = Number(url.slice(runPrefix.length));
              if (!Number.isSafeInteger(origin) || origin > candidate.id) continue;
              let source = run, built = commit;
              if (origin !== candidate.id) {
                ({data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: origin}));
                ({data: built} = await github.rest.repos.getCommit({...context.repo, ref: source.head_sha}));
              }
              if (source?.id !== origin || source.path !== '.github/workflows/ci-request.yml' ||
                  source.event !== 'merge_group' || source.status !== 'completed' || source.conclusion !== 'success' ||
                  !source.head_branch?.startsWith(`gh-readonly-queue/rust-migration/pr-${pr}-`) ||
                  built?.parents?.length !== 2 || built.parents[1]?.sha !== head ||
                  built.commit?.tree?.sha !== marker.description) continue;
              const validated = await entries(marker.description);
              if (validated === null || JSON.stringify(validated) !== JSON.stringify(current)) continue;
              return {url, tree: marker.description};
            }
            return null;
          };
          let carry = null;
          if (queue && !checker) {
            try {
              carry = await adopted();
            } catch (error) {
              core.info(`Carry lookup failed, so this group runs: ${error.message}`);
            }
          }
          // Base-relative gates compare the tested merge with the commit it merged onto, its first
          // parent. The PR's recorded base SHA may predate merges into base since (#919).
          if (!/^[0-9a-f]{40}$/.test(parent || '')) {
            throw new Error('The tested merge commit has no first parent');
          }
          for (const [key, value] of Object.entries({head, base: parent, merge,
              tree: tested.commit.tree.sha, profile, pr, checker, carried: carry?.url ?? '', 'carried-tree': carry?.tree ?? ''})) {
            core.setOutput(key, String(value));
          }

  quick:
    needs: plan
    if: needs.plan.outputs.carried == ''
    uses: ./.github/workflows/ci-quick.yml
    with:
      checkout-ref: ${{ needs.plan.outputs.merge }}
      base-ref: ${{ needs.plan.outputs.base }}

  rust:
    needs: plan
    if: needs.plan.outputs.profile == 'rust'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.plan.outputs.merge }}
        persist-credentials: false
    - name: Install pinned Rust compiler
      run: |
        channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
    - name: Rust workspace checks
      run: |
        python3 tools/migration.py rust-checks --jobs 2

  native:
    needs: plan
    if: >-
      (needs.plan.outputs.profile == 'native' || needs.plan.outputs.profile == 'full') &&
      needs.plan.outputs.checker != 'true' && needs.plan.outputs.carried == ''
    uses: ./.github/workflows/rust-migration.yml
    with:
      checkout-ref: ${{ needs.plan.outputs.merge }}

  platform:
    needs: plan
    if: >-
      needs.plan.outputs.profile != 'rust' && needs.plan.outputs.checker != 'true' &&
      needs.plan.outputs.carried == ''
    uses: ./.github/workflows/ci-build.yml
    with:
      checkout-ref: ${{ needs.plan.outputs.merge }}
      profile: ${{ needs.plan.outputs.profile }}

  publish:
    name: Publish validation result
    needs: [plan, quick, native, platform]
    # A merge group publishes even after a failed plan, so the queue removes the PR at once.
    if: >-
      always() && (needs.plan.result == 'success' && needs.plan.outputs.profile == 'full' ||
      github.event_name == 'merge_group' && needs.plan.result != 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: validation-status-${{ github.event_name == 'merge_group' && format('queue-{0}', github.run_id) || inputs.pr || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
    # No candidate checkout, artifacts, or candidate-controlled executable input.
    - uses: actions/github-script@v7
      env:
        RESULTS: ${{ toJSON(needs) }}
      with:
        script: |
          const needs = JSON.parse(process.env.RESULTS);
          const planned = needs.plan.result === 'success';
          const head = needs.plan.outputs.head;
          const pr = Number(needs.plan.outputs.pr);
          // A merge group's result goes on the group commit, which the queue merges.
          const queue = context.eventName === 'merge_group';
          const target = queue ? context.payload.merge_group.head_sha : head;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          // Combined statuses omit creators; only a status this workflow created with this run's URL
          // marks the request as this run's own.
          const listed = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
            ...context.repo, ref: target, per_page: 100
          });
          const latest = listed.find(status => status.context === 'Full validation');
          const own = latest?.target_url === runUrl && latest.creator?.login === 'github-actions[bot]' &&
            latest.creator?.type === 'Bot';
          // Only this run writes its group commit, and a failed plan may not have marked it pending.
          if (!own && !(queue && !latest)) {
            core.setFailed('This full request was superseded; preserve the newer request status');
            return;
          }
          let current = false;
          if (planned) {
            const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: pr});
            // Head identity remains valid when another PR or docs advance the base.
            // Post-merge policy checks the resulting tree to catch combined changes.
            current = pull.state === 'open' && pull.base.ref === 'rust-migration' && pull.head.sha === head;
          }
          // A checker-only request proves Quick alone. It publishes no Validated tree,
          // so nothing later treats its tree as built.
          const checker = needs.plan.outputs.checker === 'true';
          // A merge group carrying an earlier group's passing run republishes that run's result.
          const carried = needs.plan.outputs.carried || '';
          const complete = planned && carried !== '' ||
            ['plan', 'quick'].every(name => needs[name]?.result === 'success') && (checker ||
            ['native', 'platform'].every(name => needs[name]?.result === 'success') &&
            needs.native?.outputs?.validated === 'true' && needs.platform?.outputs?.validated === 'true');
          const passed = current && complete;
          const url = passed && carried ? carried : runUrl;
          await github.rest.repos.createCommitStatus({
            ...context.repo, sha: target, context: 'Full validation', state: passed ? 'success' : 'failure',
            target_url: url,
            description: passed ? (carried ? `Carried from run ${carried.split('/').pop()}: non-Markdown tree unchanged` :
              checker ? 'Checker-only PR: Quick passed; no build reads these files' :
              'All required validation passed for this PR head') :
              current ? 'Required validation failed, skipped, or was cancelled' :
              planned ? 'PR head changed; request validation again' : 'Merge group plan failed'
          });
          if (passed && !checker) {
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: target, context: 'Validated tree', state: 'success',
              target_url: url, description: carried ? needs.plan.outputs['carried-tree'] : needs.plan.outputs.tree
            });
          }
          if (!passed) core.setFailed('Full validation did not pass for the current PR head');

  # A request whose PR head moved, closed or left rust-migration tested nothing current:
  # the plan or a gate refused it. Its run ends cancelled, not failed, so a count of
  # failed runs leaves it out (#922). A merge group's refusal stays a failure.
  superseded:
    name: Cancel a superseded request
    needs: [plan, quick, rust, native, platform, publish]
    if: always() && github.event_name != 'merge_group' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
    # No checkout: this job executes only the reviewed workflow definition.
    - uses: actions/github-script@v7
      env:
        PR: ${{ inputs.pr || github.event.pull_request.number }}
        HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
      with:
        script: |
          const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR)});
          if (pull.state === 'open' && pull.base.ref === 'rust-migration' && pull.head.sha === process.env.HEAD) return;
          core.notice(`PR #${process.env.PR} no longer has head ${process.env.HEAD}; cancelling this run`);
          await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: context.runId});
          // Cancellation stops this job within seconds; the run then concludes cancelled.
          await new Promise(resolve => setTimeout(resolve, 60000));
