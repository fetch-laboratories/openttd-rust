name: Unused strings

on:
  pull_request:
  # A required check must report on each merge group too; Full's Quick runs it there.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  unused-strings:
    name: Unused strings
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Check for unused strings
      run: |
        set -ex
        python3 .github/unused-strings.py
