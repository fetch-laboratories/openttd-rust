[package]
name = "openttd-kernels"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
native-test-support = []
# Native `_DEBUG` (CMake Debug configuration): `TileAdd` reconstructs and asserts.
native-debug = []

[lib]
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
blake2 = { features = ["zeroize"], version = "=0.11.0", default-features = false }
chacha20 = { version = "=0.10.2", default-features = false, features = ["legacy", "xchacha", "zeroize"] }
curve25519-dalek = { features = ["zeroize"], version = "=5.0.0", default-features = false }
poly1305 = { features = ["zeroize"], version = "=0.9.1", default-features = false }
sha2 = { features = ["zeroize"], version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
